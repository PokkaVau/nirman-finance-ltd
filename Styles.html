<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ==========================================================================
     NIRMAN FINANCE LTD — CORPORATE LUXURY DESIGN SYSTEM
     Colors:
     - Navy Primary:   #174879
     - Secondary Blue: #245B8E
     - Primary Green:  #2BA653
     - Light Green:    #EAF7EE
     - Light Blue:     #EDF4FA
     - Background:     #F5F8FC
     - Dark Text:      #172B3A
     - Secondary Text: #687789
     - Border:         #E3EAF1
     ========================================================================== */

  :root {
    --navy-primary: #174879;
    --navy-secondary: #245B8E;
    --navy-dark: #0f3052;
    --navy-glow: rgba(23, 72, 121, 0.12);
    --green-primary: #2BA653;
    --green-hover: #238944;
    --green-light: #EAF7EE;
    --green-glow: rgba(43, 166, 83, 0.15);
    --blue-light: #EDF4FA;
    --bg-main: #F5F8FC;
    --card-bg: #FFFFFF;
    --text-dark: #172B3A;
    --text-muted: #687789;
    --text-light: #94A3B8;
    --border-color: #E3EAF1;
    --border-subtle: #F0F4F8;
    --danger-red: #D9383A;
    --danger-light: #FDF0F0;
    --warning-gold: #D97706;
    --warning-light: #FEF3C7;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --bezier: cubic-bezier(0.32, 0.72, 0, 1);
    --radius-outer: 1.5rem;
    --radius-inner: 1.125rem;
    --shadow-ambient: 0 10px 30px -4px rgba(23, 72, 121, 0.05), 0 4px 12px -2px rgba(23, 72, 121, 0.03);
    --shadow-elevated: 0 20px 40px -6px rgba(23, 72, 121, 0.08), 0 8px 16px -4px rgba(23, 72, 121, 0.04);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    font-family: var(--font-sans);
    background-color: var(--bg-main);
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* Financial numbers clarity */
  .tnum {
    font-variant-numeric: tabular-nums;
  }

  /* Text Alignment Utilities */
  .text-right { text-align: right !important; }
  .text-center { text-align: center !important; }
  .text-left { text-align: left !important; }

  /* Custom Slim Scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 9999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--navy-secondary);
  }

  /* ==========================================================================
     APP LAYOUT: SIDEBAR + MAIN STAGE
     ========================================================================== */
  .app-container {
    display: flex;
    min-height: 100vh;
    background: var(--bg-main);
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    position: relative;
  }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    background: #FFFFFF;
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 40;
    transition: transform 0.4s var(--bezier);
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 48, 82, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 35;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--bezier);
  }

  .sidebar-backdrop.active {
    display: block;
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar-header {
    padding: 1.5rem 1.25rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 0.875rem;
    position: relative;
  }

  .sidebar-close-btn {
    display: none;
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0.4rem;
    border-radius: 0.5rem;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .sidebar-close-btn:hover {
    background: var(--blue-light);
    color: var(--navy-primary);
  }

  .brand-logo-img {
    width: 44px;
    height: 44px;
    border-radius: 0.75rem;
    object-fit: contain;
    background: #FFFFFF;
    border: 1px solid var(--border-color);
    box-shadow: 0 2px 8px rgba(23, 72, 121, 0.08);
  }

  .brand-text-block {
    display: flex;
    flex-direction: column;
  }

  .brand-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--navy-primary);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .brand-tagline {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--green-primary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem 0.875rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .nav-group-title {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 0.75rem 0.75rem 0.35rem 0.75rem;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    padding: 0.75rem 1rem;
    border-radius: 9999px;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-muted);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s var(--bezier);
    border: 1px solid transparent;
    user-select: none;
  }

  .nav-item:hover {
    color: var(--navy-primary);
    background: var(--blue-light);
  }

  .nav-item.active {
    background: var(--navy-primary);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(23, 72, 121, 0.25);
  }

  .nav-icon {
    width: 20px;
    height: 20px;
    stroke-width: 2;
    flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 1rem 1.25rem;
    border-top: 1px solid var(--border-color);
    background: #FAFCFE;
  }

  .admin-badge {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .admin-avatar {
    width: 38px;
    height: 38px;
    border-radius: 9999px;
    background: linear-gradient(135deg, var(--navy-primary), var(--navy-secondary));
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    box-shadow: 0 2px 6px rgba(23, 72, 121, 0.2);
  }

  .admin-info {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .admin-name {
    font-size: 0.825rem;
    font-weight: 700;
    color: var(--text-dark);
  }

  .admin-status {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    color: var(--green-primary);
    font-weight: 600;
  }

  .status-dot-pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green-primary);
    box-shadow: 0 0 0 2px rgba(43, 166, 83, 0.2);
  }

  /* MAIN STAGE */
  .main-stage {
    flex: 1;
    margin-left: 280px;
    min-height: 100vh;
    width: calc(100% - 280px);
    max-width: calc(100% - 280px);
    min-width: 0;
    display: flex;
    flex-direction: column;
    transition: all 0.35s var(--bezier);
    overflow-x: hidden;
    position: relative;
  }

  /* TOP HEADER (Island Navbar) */
  .top-header {
    height: 74px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }

  .menu-toggle-btn {
    display: none;
    background: transparent;
    border: none;
    color: var(--navy-primary);
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 0.5rem;
  }

  .page-header-info h1 {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--navy-primary);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .page-header-info p {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 0.875rem;
  }

  .header-date-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--blue-light);
    color: var(--navy-primary);
    padding: 0.45rem 0.9rem;
    border-radius: 9999px;
    font-size: 0.775rem;
    font-weight: 600;
    border: 1px solid rgba(23, 72, 121, 0.1);
  }

  /* CONTENT WRAPPER */
  .content-wrapper {
    flex: 1;
    padding: 2rem;
    max-width: 1440px;
    width: 100%;
    min-width: 0;
    margin: 0 auto;
    box-sizing: border-box;
  }

  /* ==========================================================================
     HIGH-END VISUAL DESIGN: DOUBLE-BEZEL (DOPPELRAND) ARCHITECTURE
     ========================================================================== */
  .bezel-card {
    background: rgba(23, 72, 121, 0.025);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-outer);
    padding: 0.45rem;
    box-shadow: var(--shadow-ambient);
    transition: transform 0.3s var(--bezier), box-shadow 0.3s var(--bezier);
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
  }

  .bezel-card:hover {
    box-shadow: var(--shadow-elevated);
  }

  .bezel-inner {
    background: #FFFFFF;
    border-radius: var(--radius-inner);
    padding: 1.5rem;
    border: 1px solid rgba(227, 234, 241, 0.8);
    position: relative;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9);
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
  }

  /* EYEBROW TAG */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.2rem 0.65rem;
    border-radius: 9999px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 0.6rem;
  }

  .eyebrow-navy {
    background: var(--blue-light);
    color: var(--navy-primary);
    border: 1px solid rgba(23, 72, 121, 0.15);
  }

  .eyebrow-green {
    background: var(--green-light);
    color: var(--green-primary);
    border: 1px solid rgba(43, 166, 83, 0.2);
  }

  /* ==========================================================================
     BUTTON-IN-BUTTON (NESTED CTA ARCHITECTURE)
     ========================================================================== */
  .btn-island {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.65rem 1.25rem;
    border-radius: 9999px;
    font-size: 0.85rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.25s var(--bezier);
    user-select: none;
  }

  .btn-island:active {
    transform: scale(0.97);
  }

  .btn-island-primary {
    background: var(--navy-primary);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(23, 72, 121, 0.25);
  }

  .btn-island-primary:hover {
    background: var(--navy-secondary);
    box-shadow: 0 6px 20px rgba(23, 72, 121, 0.35);
  }

  .btn-island-green {
    background: var(--green-primary);
    color: #FFFFFF;
    box-shadow: 0 4px 14px rgba(43, 166, 83, 0.25);
  }

  .btn-island-green:hover {
    background: var(--green-hover);
    box-shadow: 0 6px 20px rgba(43, 166, 83, 0.35);
  }

  .btn-island-secondary {
    background: #FFFFFF;
    color: var(--navy-primary);
    border: 1px solid var(--border-color);
  }

  .btn-island-secondary:hover {
    background: var(--blue-light);
    border-color: var(--navy-secondary);
  }

  .btn-icon-circle {
    width: 26px;
    height: 26px;
    border-radius: 9999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.2);
    transition: transform 0.25s var(--bezier);
    flex-shrink: 0;
  }

  .btn-island-secondary .btn-icon-circle {
    background: var(--blue-light);
    color: var(--navy-primary);
  }

  .btn-island:hover .btn-icon-circle {
    transform: translateX(2px) translateY(-1px) scale(1.05);
  }

  /* SMALL BUTTONS */
  .btn-action-sm {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-color);
    background: #FFFFFF;
    color: var(--navy-primary);
    transition: all 0.2s var(--bezier);
  }

  .btn-action-sm:hover {
    background: var(--blue-light);
    border-color: var(--navy-primary);
  }

  .btn-action-sm.btn-success {
    background: var(--green-light);
    color: var(--green-primary);
    border-color: rgba(43, 166, 83, 0.3);
  }

  .btn-action-sm.btn-success:hover {
    background: var(--green-primary);
    color: #FFFFFF;
  }

  /* ==========================================================================
     DASHBOARD METRICS BENTO GRID
     ========================================================================== */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
    min-width: 0;
    width: 100%;
  }

  .metrics-grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.25rem;
    margin-bottom: 1.5rem;
    min-width: 0;
    width: 100%;
  }

  .metric-card-inner {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
  }

  .metric-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .metric-icon-wrap {
    width: 44px;
    height: 44px;
    border-radius: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .metric-icon-navy {
    background: var(--blue-light);
    color: var(--navy-primary);
  }

  .metric-icon-green {
    background: var(--green-light);
    color: var(--green-primary);
  }

  .metric-icon-amber {
    background: var(--warning-light);
    color: var(--warning-gold);
  }

  .metric-icon-red {
    background: var(--danger-light);
    color: var(--danger-red);
  }

  .metric-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .metric-value {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--text-dark);
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-top: 0.25rem;
  }

  .metric-value-green {
    color: var(--green-primary);
  }

  .metric-sub {
    font-size: 0.75rem;
    color: var(--text-light);
    font-weight: 500;
    margin-top: 0.5rem;
  }

  /* DASHBOARD SECTION SPLITS */
  .dashboard-split-grid {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 1.5rem;
    margin-bottom: 2rem;
    min-width: 0;
    width: 100%;
  }

  .dashboard-three-split {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
    min-width: 0;
    width: 100%;
  }

  /* ==========================================================================
     CHARTS CONTAINER (Lightweight canvas charts)
     ========================================================================== */
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }

  .chart-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--navy-primary);
  }

  .chart-canvas-container {
    position: relative;
    width: 100%;
    height: 260px;
  }

  /* ==========================================================================
     TABLE SYSTEM & SEARCH TOOLBAR
     ========================================================================== */
  .toolbar-wrapper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .search-input-box {
    position: relative;
    min-width: 260px;
    flex: 1;
    max-width: 400px;
  }

  .search-input-box input {
    width: 100%;
    padding: 0.65rem 1rem 0.65rem 2.5rem;
    border-radius: 9999px;
    border: 1px solid var(--border-color);
    background: #FFFFFF;
    font-family: var(--font-sans);
    font-size: 0.85rem;
    color: var(--text-dark);
    outline: none;
    transition: all 0.2s var(--bezier);
  }

  .search-input-box input:focus {
    border-color: var(--navy-primary);
    box-shadow: 0 0 0 3px rgba(23, 72, 121, 0.1);
  }

  .search-icon {
    position: absolute;
    left: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    pointer-events: none;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .select-custom {
    padding: 0.65rem 1.25rem;
    border-radius: 9999px;
    border: 1px solid var(--border-color);
    background: #FFFFFF;
    font-family: var(--font-sans);
    font-size: 0.825rem;
    font-weight: 600;
    color: var(--text-dark);
    outline: none;
    cursor: pointer;
    transition: all 0.2s var(--bezier);
  }

  .select-custom:focus {
    border-color: var(--navy-primary);
  }

  /* DATA TABLES */
  .table-responsive {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: var(--radius-inner);
    border: 1px solid var(--border-color);
    background: #FFFFFF;
    box-sizing: border-box;
    position: relative;
    margin-bottom: 0.5rem;
  }

  .corporate-table {
    width: 100%;
    min-width: 680px;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.85rem;
    text-align: left;
  }

  .corporate-table thead {
    background: #F8FAFD;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .corporate-table th {
    padding: 0.9rem 1.25rem;
    font-weight: 700;
    font-size: 0.725rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--navy-primary);
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
  }

  .corporate-table td {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-dark);
    vertical-align: middle;
    white-space: nowrap;
  }

  .corporate-table tbody tr {
    transition: background 0.15s ease;
  }

  .corporate-table tbody tr:hover {
    background: var(--blue-light);
  }

  .corporate-table tbody tr:last-child td {
    border-bottom: none;
  }

  /* STATUS BADGES */
  .badge-status {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.725rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .badge-active, .badge-paid {
    background: var(--green-light);
    color: var(--green-primary);
    border: 1px solid rgba(43, 166, 83, 0.2);
  }

  .badge-pending {
    background: var(--blue-light);
    color: var(--navy-primary);
    border: 1px solid rgba(23, 72, 121, 0.2);
  }

  .badge-partial {
    background: var(--warning-light);
    color: var(--warning-gold);
    border: 1px solid rgba(217, 119, 6, 0.2);
  }

  .badge-overdue, .badge-inactive {
    background: var(--danger-light);
    color: var(--danger-red);
    border: 1px solid rgba(217, 56, 58, 0.2);
  }

  /* ==========================================================================
     MODALS & DRAWER OVERLAYS
     ========================================================================== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 48, 82, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s var(--bezier);
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-dialog {
    background: #FFFFFF;
    border-radius: var(--radius-outer);
    width: 100%;
    max-width: 640px;
    max-height: 86vh;
    display: flex;
